<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>4DGS + World Foundation Model</title>
  </head>
  <body>
    <div id="canvasWrap"></div>
    <div id="loader" aria-live="polite" aria-busy="true">
      <div class="loader-card">
        <svg class="loader-spinner" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="20" stroke="rgba(255,255,255,0.08)" stroke-width="3"></circle>
          <path d="M44 24a20 20 0 0 0-20-20" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <p id="loaderText">Loading scene…</p>
      </div>
    </div>
    <p class="movement-note">Drag to orbit · Scroll to zoom</p>
    <div class="hud">
      <p class="kicker">4DGS + World Foundation Model</p>
      <h1 id="world-name">…</h1>
      <p id="status"></p>
    </div>
    <div class="gracia-controls">
      <div class="panel">
        <div class="dropdown" id="srcDD">
          <button type="button" class="dd-toggle" id="srcToggle">Source&hellip;</button>
          <div class="dd-menu" id="srcMenu"></div>
        </div>
        <div class="divider"></div>
        <button type="button" class="btn on" id="toggleProbe">Relight</button>
      </div>
    </div>
    <div class="world-switcher panel" aria-label="3DGS scene navigation">
      <button type="button" class="world-switch-btn" id="prevWorld" aria-label="Previous 3DGS scene">←</button>
      <button type="button" class="world-switch-btn" id="nextWorld" aria-label="Next 3DGS scene">→</button>
    </div>
    <div class="playback-panel panel" id="barWrap"></div>
    <div id="mobile-controls" aria-hidden="true">
      <div id="mobile-world-buttons">
        <button type="button" class="mobile-world-btn" id="mobilePrevWorld" aria-label="Previous world">←</button>
        <button type="button" class="mobile-world-btn" id="mobileNextWorld" aria-label="Next world">→</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
